<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Muhriddin Group</title>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="container">
      <!-- LOGIN -->

      <div class="login-container">
        <div class="logo">
          <img src="./src/assets/img/logo.png" width="200" />
        </div>

        <form id="login-form">
          <label>Login</label>
          <input type="text" id="login" placeholder="Login" />

          <label>Parol</label>
          <input type="password" id="password" placeholder="Parol" />

          <button type="submit">Kirish</button>
        </form>
      </div>

      <!-- ADMIN -->

      <div class="admin">
        <h1>Admin Panel</h1>
        <div class="dashboard">
          <div class="card">
            <h3>Jami ishlar</h3>
            <p id="totalJobs">0</p>
          </div>

          <div class="card">
            <h3>Press</h3>
            <p id="pressJobs">0</p>
          </div>

          <div class="card">
            <h3>Jatka</h3>
            <p id="jatkaJobs">0</p>
          </div>

          <div class="card">
            <h3>To'langan</h3>
            <p id="paidJobs">0</p>
          </div>

          <div class="card">
            <h3>To'lanmagan</h3>
            <p id="unpaidJobs">0</p>
          </div>
        </div>

        <div class="admin-top">
          <input type="text" id="search" placeholder="Qidirish..." />
          <button id="downloadExcel">Excel yuklab olish</button>
          <button id="logoutAdmin">Chiqish</button>
        </div>

        <h2>Bugungi ishlar</h2>
        <div class="card-list" id="todayList"></div>

        <button id="openAllJobs" class="secondary-btn">Barchasi</button>
      </div>

      <!-- WORKER -->

      <div class="worker-panel">
        <h1>Worker Panel</h1>

        <button id="logoutWorker">Chiqish</button>

        <div class="dashboard">
          <div class="card">
            <h3>Jami press</h3>
            <p id="myTotalPress">0</p>
          </div>
          <div class="card">
            <h3>Jami jatka (yer)</h3>
            <p id="myTotalLand">0</p>
          </div>
        </div>

        <form id="worker-form">
          <label>Sana</label>
          <input type="date" id="workDate" />

          <label>Ish turi</label>
          <select id="work-select">
            <option value="">Tanlang</option>
            <option value="press">Press apparat</option>
            <option value="jatka">Jatka apparat</option>
          </select>

          <!-- PRESS -->
          <div class="press">
            <input type="number" id="pressCount" placeholder="Presslar soni" />
            <input type="text" id="pressOwner" placeholder="Yer egasi" />
            <input
              type="text"
              id="pressPhone"
              placeholder="Mijoz telefon raqami"
            />
            <select id="pressPayment">
              <option value="">To'lov</option>
              <option value="Ha">Ha</option>
              <option value="Yo'q">Yo'q</option>
            </select>
            <input
              type="number"
              id="pressPrice"
              placeholder="Narxi"
              style="display: none"
            />
          </div>

          <!-- JATKA -->
          <div class="jatka">
            <input
              type="number"
              id="landArea"
              placeholder="Yer maydoni"
              step="0.01"
              min="0"
            />
            <input type="text" id="jatkaOwner" placeholder="Yer egasi" />
            <input
              type="text"
              id="jatkaPhone"
              placeholder="Mijoz telefon raqami"
            />
            <select id="jatkaPayment">
              <option value="">To'lov</option>
              <option value="Ha">Ha</option>
              <option value="Yo'q">Yo'q</option>
            </select>
            <input
              type="number"
              id="jatkaPrice"
              placeholder="Narxi"
              style="display: none"
            />
          </div>

          <label>Izoh</label>
          <textarea
            id="workComment"
            placeholder="Ish haqida izoh yozing... (majburiy)"
            rows="3"
          ></textarea>

          <button type="submit">Yuborish</button>
        </form>

        <h2>Mening yuborganlarim</h2>
        <div class="card-list" id="myJobsList"></div>
      </div>
    </div>

    <!-- BARCHA ISHLAR (filtr) OYNASI -->
    <div class="modal" id="allJobsModal">
      <div class="modal-box wide">
        <h2>Barcha ishlar</h2>

        <button id="allJobsExcelBtn">Excel faylni yuklash</button>

        <label>Ishchini tanlash</label>
        <select id="filterWorker">
          <option value="">Barchasi</option>
        </select>

        <label>Ishni tanlash</label>
        <select id="filterType">
          <option value="">Barchasi</option>
          <option value="Press">Press</option>
          <option value="Jatka">Jatka</option>
        </select>

        <label>To'lovni tanlash</label>
        <select id="filterPayment">
          <option value="">Barchasi</option>
          <option value="Ha">Qilingan</option>
          <option value="Yo'q">Qilinmagan</option>
        </select>

        <label>Sana</label>
        <input type="date" id="filterDate" />

        <button id="filterSearchBtn">Qidirish</button>

        <div class="card-list scrollable" id="allJobsList"></div>

        <button id="closeAllJobs" class="secondary-btn">Yopish</button>
      </div>
    </div>

    <!-- MA'LUMOT TO'LIQ KO'RINISHI (faqat o'qish uchun) -->
    <div class="modal" id="detailModal">
      <div class="modal-box">
        <h2>Ma'lumot</h2>
        <div class="detail-view" id="detailView"></div>
        <div class="modal-buttons">
          <button id="detailEditBtn">Tahrirlash</button>
          <button id="closeDetail" class="secondary-btn">Yopish</button>
        </div>
      </div>
    </div>

    <!-- TAHRIRLASH PANELI (admin ham, worker ham shu orqali) -->
    <div class="modal" id="editFormModal">
      <div class="modal-box">
        <h2>Ma'lumotni tahrirlash</h2>
        <input type="hidden" id="editId" />
        <input type="hidden" id="editType" />

        <label>Sana</label>
        <input type="date" id="editDate" />

        <label>Ish turi</label>
        <p class="type-label" id="editTypeLabel"></p>

        <div id="editPressGroup" style="display: none">
          <label>Presslar soni</label>
          <input type="number" id="editPress" />
        </div>

        <div id="editJatkaGroup" style="display: none">
          <label>Yer maydoni</label>
          <input type="number" id="editLand" step="0.01" min="0" />
        </div>

        <label>Yer egasi</label>
        <input type="text" id="editOwner" />

        <label>Mijoz telefon raqami</label>
        <input type="text" id="editPhone" placeholder="Telefon" />

        <label>To'lov</label>
        <select id="editPayment">
          <option value="Ha">Ha</option>
          <option value="Yo'q">Yo'q</option>
        </select>

        <label>Narxi</label>
        <input type="number" id="editPrice" />

        <label>Izoh</label>
        <textarea id="editComment" rows="3"></textarea>

        <div class="modal-buttons">
          <button id="saveEdit">Yangilash</button>
          <button id="closeEdit">Bekor qilish</button>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
